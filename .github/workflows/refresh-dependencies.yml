name: Refresh and verify npm dependencies

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/refresh-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zimmarket-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate a reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Apply compatible dependency security fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Install exact locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Export web app
        run: npx expo export --platform web

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android

      - name: Record remaining dependency advisories
        if: always()
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          let audit = {};
          try { audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8')); } catch {}
          const v = audit.metadata?.vulnerabilities || {};
          const line = `Dependency audit: ${v.total ?? 'unknown'} total; ${v.critical ?? 0} critical, ${v.high ?? 0} high, ${v.moderate ?? 0} moderate, ${v.low ?? 0} low. Review npm advisories before any major-version upgrade.`;
          console.log(line);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\\n');
          NODE

      - name: Commit the tested lockfile
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "build: lock and verify npm dependencies"
            git push
          fi
