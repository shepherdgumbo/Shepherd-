name: Build ZimMarket Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "package.json"
      - "app.json"
      - "tsconfig.json"
      - "firebase/**"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zimmarket-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK root: ${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Check TypeScript
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Diagnose Expo native module metadata
        shell: bash
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/expo-modules.json
          node <<'NODE'
          const result = require("/tmp/expo-modules.json");
          const modules = result.modules || [];
          console.log("Resolved Expo Android modules:", modules.length);
          let incomplete = false;
          modules.forEach((module, moduleIndex) => {
            (module.projects || []).forEach((project, projectIndex) => {
              const publication = project.publication;
              if (publication && (!publication.version || !publication.id || !publication.group || !publication.repository)) {
                incomplete = true;
                console.log("INCOMPLETE_PUBLICATION", JSON.stringify({
                  moduleIndex,
                  module: module.packageName,
                  projectIndex,
                  project,
                }));
              }
            });
          });
          if (!incomplete) console.log("All declared Android publications include required fields.");
          NODE

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: zimmarket-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
