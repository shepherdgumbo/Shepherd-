name: Build standalone ZimMarket Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "tsconfig.json"
      - "firebase/**"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zimmarket-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK root: ${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install exact locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Verify Android JavaScript bundle can be exported
        run: npx expo export --platform android

      - name: Generate clean native Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign if needed and verify standalone APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Gradle did not produce a release APK."
            exit 1
          fi

          mkdir -p ../dist
          OUT="../dist/ZimMarket-standalone-preview.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"

          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            cp "$APK" "$OUT"
            echo "Release APK already has a valid signature."
          else
            KEYSTORE="${RUNNER_TEMP}/zimmarket-preview.keystore"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEYSTORE" -storepass "preview-only-pass" \
              -alias zimmarket-preview -keypass "preview-only-pass" \
              -dname "CN=ZimMarket Preview, OU=Testing, O=STG, L=Harare, ST=Harare, C=ZW" \
              -keyalg RSA -keysize 2048 -validity 3650
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" --ks-key-alias zimmarket-preview \
              --ks-pass pass:preview-only-pass --key-pass pass:preview-only-pass \
              --out "$OUT" "$APK"
          fi

          "$APKSIGNER" verify --verbose "$OUT"
          ls -lh "$OUT"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: zimmarket-standalone-preview-apk
          path: dist/ZimMarket-standalone-preview.apk
          if-no-files-found: error
          retention-days: 14
