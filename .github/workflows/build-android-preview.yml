name: Build ZimMarket Android preview

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "package.json"
      - "app.json"
      - "eas.json"
      - "firebase/**"
      - ".github/workflows/build-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zimmarket-eas-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Add an Expo access token under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Create or link EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest project:init --force --non-interactive

      - name: Build installable Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
