name: Deploy ZimMarket web to Firebase Hosting

on:
  # Publish a reviewable preview for code changes without replacing the production site.
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-zimmarket-firebase-hosting.yml"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Preview is safe for review. Choose live only when you intentionally want to replace the current website.
        required: true
        type: choice
        default: preview
        options:
          - preview
          - live
      confirm_live_deploy:
        description: Type DEPLOY only to replace the production website (ignored for preview).
        required: true
        type: string
        default: "NO"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.deploy_target == 'preview' || (inputs.deploy_target == 'live' && inputs.confirm_live_deploy == 'DEPLOY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require Firebase deployment credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing Actions secret FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35. Nothing was deployed. Add a Firebase service-account JSON with Hosting deploy permission as a GitHub Actions secret, then run again."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build static Expo web app
        run: npx expo export --platform web

      - name: Deploy preview channel
        if: ${{ github.event_name == 'push' || inputs.deploy_target == 'preview' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35 }}
          projectId: zimmarket-d4b35
          channelId: zimmarket-expo-preview
          expires: 7d

      - name: Deploy production website
        if: ${{ inputs.deploy_target == 'live' && inputs.confirm_live_deploy == 'DEPLOY' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35 }}
          projectId: zimmarket-d4b35
          channelId: live
