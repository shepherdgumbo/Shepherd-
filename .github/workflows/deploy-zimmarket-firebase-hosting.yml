name: Build and preview ZimMarket web on Firebase Hosting

on:
  # Publish a reviewable preview for code changes without replacing the production site.
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - "firestore.rules"
      - "storage.rules"
      - ".firebaserc"
      - ".github/workflows/deploy-zimmarket-firebase-hosting.yml"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Preview is safe for review. Choose live only when you intentionally want to replace the current website.
        required: true
        type: choice
        default: preview
        options:
          - preview
          - live
      confirm_live_deploy:
        description: Type DEPLOY only to replace the production website (ignored for preview).
        required: true
        type: string
        default: "NO"

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.deploy_target == 'preview' || (inputs.deploy_target == 'live' && inputs.confirm_live_deploy == 'DEPLOY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check whether Firebase deployment credentials are configured
        id: firebase_credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35 }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Web build will be verified, but Firebase deployment is skipped because FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35 is not configured."
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install exact locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build static Expo web app
        run: npx expo export --platform web

      - name: Require credentials for explicitly requested production deployment
        if: ${{ inputs.deploy_target == 'live' && inputs.confirm_live_deploy == 'DEPLOY' && steps.firebase_credentials.outputs.available != 'true' }}
        shell: bash
        run: |
          echo "::error::No production deployment was performed. Configure the repository secret FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35 with a Firebase service-account JSON that has Hosting deploy permission, then rerun with target=live and confirmation=DEPLOY."
          exit 1

      - name: Deploy preview channel
        if: ${{ steps.firebase_credentials.outputs.available == 'true' && (github.event_name == 'push' || inputs.deploy_target == 'preview') }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35 }}
          projectId: zimmarket-d4b35
          channelId: zimmarket-expo-preview
          expires: 7d

      - name: Deploy production website
        if: ${{ steps.firebase_credentials.outputs.available == 'true' && inputs.deploy_target == 'live' && inputs.confirm_live_deploy == 'DEPLOY' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZIMMARKET_D4B35 }}
          projectId: zimmarket-d4b35
          channelId: live
