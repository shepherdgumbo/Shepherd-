name: Expo app checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: expo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install exact locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Bundle Android JavaScript
        run: npx expo export --platform android
      - name: Export web build for Firebase Hosting compatibility
        run: npx expo export --platform web
